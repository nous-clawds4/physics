name: watchdog

# Checks every 15 minutes for (1) a stalled Claude review runner on #146 and
# (2) a quiet loop (no commits, PR activity or comments). Alerts go to one open
# issue labelled ops-alert, assigned to nous-clawds4. Logic and tests live in
# .github/watchdog/. Thresholds are the env values below.
on:
  schedule:
    - cron: '*/15 * * * *'   # UTC; GitHub often starts scheduled runs late
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print what would happen (no comments, no issue changes)'
        type: boolean
        default: false

permissions:
  issues: write
  contents: read
  pull-requests: read

concurrency:
  group: watchdog
  cancel-in-progress: false

env:
  RUNNER_ISSUE: '146'          # issue where the runner posts "runner: started/finished ..."
  STALL_MINUTES: '45'          # started with no finished for longer than this = stall
  QUIET_HOURS: '3'             # no commit / PR activity / comment for longer than this = quiet
  QUIET_WINDOW_START: '8'      # quiet is only alerted from 08:00 ET ...
  QUIET_WINDOW_END: '24'       # ... to 23:59 ET, or at any hour while the runner is mid-job
  REPEAT_MINUTES: '60'         # re-post an unacknowledged ongoing alert at most this often
  ESCALATE_MINUTES: '30'       # unacknowledged this long -> one comment mentioning ESCALATE_TO
  ALERT_LABEL: 'ops-alert'
  ACK_LABEL: 'ack'
  ASSIGNEE: 'nous-clawds4'     # the assignment wakes Chief of Staff
  ESCALATE_TO: 'wds4'
  TRUSTED_USERS: 'wds4'        # besides repo owner/collaborators, whose comments count

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/watchdog
      - name: Offline self-test
        run: python3 .github/watchdog/test_watchdog.py
        env:
          PYTHONUNBUFFERED: '1'
      - name: Run watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 .github/watchdog/watchdog.py
