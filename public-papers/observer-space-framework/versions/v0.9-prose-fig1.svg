<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="serif" font-size="13">
<title>Figure 1. A history: segments, a jump, the arm set and the arrival flag</title>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="black"/></marker>
<marker id="arg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#666"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<line x1="30" y1="170" x2="150" y2="170" stroke="black" stroke-width="2" marker-end="url(#ar)"/>
<text x="60" y="160" font-size="13" text-anchor="start" fill="black">segment (type (i))</text>
<circle cx="155" cy="170" r="5" fill="black"/>
<text x="150" y="195" font-size="13" text-anchor="middle" fill="black">(O^u, seg)</text>
<text x="155" y="215" font-size="13" text-anchor="middle" fill="black">A = B_R(O^u)</text>
<text x="155" y="232" font-size="13" text-anchor="middle" fill="black">= {[γ]} ∪ succ_R(O^u)</text>
<line x1="160" y1="170" x2="300" y2="170" stroke="#666" stroke-width="2" marker-end="url(#arg)"/>
<text x="230" y="160" font-size="13" text-anchor="middle" fill="#666">continue arm [γ]</text>
<line x1="160" y1="165" x2="300" y2="80" stroke="black" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<text x="200" y="95" font-size="13" text-anchor="middle" fill="black">edge of R (jump)</text>
<line x1="160" y1="175" x2="300" y2="260" stroke="#666" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arg)"/>
<text x="205" y="268" font-size="13" text-anchor="middle" fill="#666">edge of R</text>
<circle cx="305" cy="78" r="5" fill="black"/>
<text x="305" y="62" font-size="13" text-anchor="middle" fill="black">(O′^u′, jump)</text>
<text x="312" y="40" font-size="13" text-anchor="middle" fill="black">A = {[γ]}: one arm, no decision</text>
<line x1="310" y1="78" x2="450" y2="78" stroke="black" stroke-width="2" marker-end="url(#ar)"/>
<text x="380" y="98" font-size="13" text-anchor="middle" fill="black">segment, positive proper time</text>
<circle cx="455" cy="78" r="5" fill="black"/>
<text x="440" y="62" font-size="13" text-anchor="end" fill="black">(O″^u″, seg)</text>
<line x1="460" y1="78" x2="560" y2="30" stroke="#666" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arg)"/>
<line x1="460" y1="78" x2="600" y2="78" stroke="#666" stroke-width="2" marker-end="url(#arg)"/>
<line x1="460" y1="83" x2="560" y2="130" stroke="#666" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arg)"/>
<text x="610" y="82" font-size="13" text-anchor="start" fill="black">next decision:</text>
<text x="610" y="98" font-size="13" text-anchor="start" fill="black">A = B_R(O″^u″)</text>
<text x="30" y="300" font-size="12" text-anchor="start" fill="black">Solid: segments (type (i), carrying proper time). Dashed: edges of R (type-(ii) jumps, carrying none). Grey: arms not taken.</text>
<text x="30" y="318" font-size="12" text-anchor="start" fill="black">The state is (O^u, a) with arrival flag a ∈ {seg, jump}; after a jump only the continue arm is in force (strict alternation, §8.2 items 2 and 7).</text>
</svg>