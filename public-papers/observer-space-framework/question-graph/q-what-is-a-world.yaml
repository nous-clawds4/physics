id: q-what-is-a-world
type: question
title: "What is a world, relative to an observer?"
synopsis: >-
  Many worlds share one local patch. Which worlds is an observer's germ compatible with,
  and what is counted when the paper speaks of alternatives?
parents: [a-jet-direction]
hold: L3   # weakly held (disclosed)
rationale: >-
  Raised by Paper 1's lock that nothing reconstructs a whole world from O (v0.7.1 §2).
  The relative ensembles E_W and E_M need a notion of world.
