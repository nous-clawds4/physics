id: q-measure
type: question
title: "How are the arms weighted? ((M1)/(M2); also T2 = Q-D3 = #139 (b))"
synopsis: >-
  At a branch point, what measure do the arms get: a per-vertex equal-weight postulate,
  or Paper 1's count of distinct evolutions at a named cut?
parents: [a-type-ii]
hold: L3   # weakly held (disclosed)
rationale: >-
  Framed as (M1)/(M2) in v0.6 after Claude #128 row 4 and Geometry #129 (Paper 1 measure
  honesty); scoped symmetrically in v0.7 (#156). The same call appears as T2
  (Mathematical Foundations v0.3), Q-D3, and #139 (b) (v0.7.1 header item 2 and §9
  table: "(b) = T2 and (M1)/(M2)"). Undecided in every version ("This paper does not
  choose between them"). EPP2, weight by ensemble size, is kept only as a foil and is
  not mapped as a node (see gaps).
# h = h(a-type-ii) = 0.6859 (a question carries its weakest parent's h; the viewer computes it)
