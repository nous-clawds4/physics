rationale: >-
  Geometry #118: what escapes the CWS singleton for branching is a discontinuous jump
  plus discrete graph incidence, the Option E residue; pairing it with finite-k matching
  "does not buy branching power". Public from v0.5 (#119, #123), working and abandonable
  through v0.7.1 (§4.2). v0.5's header: the relocated HOLE is "cleared as a definition
  (B_R given R)". Record note: the arm set changed across versions (the v0.4 cover says
  the arms are the out-star; v0.6 on counts the continue arm too, after #128). Ratings
  (q, a): proposal, pending David's signature. Hold L3 (weakly held).
