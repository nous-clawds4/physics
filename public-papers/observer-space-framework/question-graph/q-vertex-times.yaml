id: q-vertex-times
type: question
title: "When may a history branch (which germs are vertices)?"
synopsis: >-
  The per-vertex weight needs discrete branch points along each segment. What selects
  the candidate branch times along a geodesic?
parents: [a-type-ii]
hold: L3   # weakly held (disclosed)
rationale: >-
  The hard gate's second clause (branch points discrete in proper time along each
  segment) was added in v0.4 after Claude #105 §3.1. The vertex question itself was first posed in-house as the "law of V*" (#102 §5 item 2; #103 §2.1), which #105 tied to §3.1's missing τ-slice.
# h = h(a-type-ii) = 0.6859 (a question carries its weakest parent's h; the viewer computes it)
