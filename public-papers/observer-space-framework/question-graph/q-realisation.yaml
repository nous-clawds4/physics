id: q-realisation
type: question
title: "Must each type-(ii) edge be realised in some spacetime? ((a)/(b))"
synopsis: >-
  Should an edge from O^u to O'^u' require a connected analytic world in which a
  future-directed timelike geodesic joins occurrences of the two germs?
parents: [a-type-ii]
hold: L3   # weakly held (disclosed)
rationale: >-
  An open one-liner in v0.4 (#112), with a cost table in v0.5; re-costed and made
  lock-side in v0.6 after Claude #128 row 1 (Geometry #129 ACCEPT: v0.5's cost row
  saying (a) forbids curvature-changing jumps was false). v0.8 B.2b logs it as moved to
  an open call. Compatibility (§2), if kept, is (a).
