id: a-world-analytic
type: answer
title: "A world is a pointed analytic spacetime W = (M, p)"
synopsis: >-
  A world is a connected real-analytic Lorentzian 4-manifold with a point that carries
  the germ. E_W(O), the pointed worlds compatible with the germ, holds occurrences of
  one lump, not extra observers.
parents: [q-what-is-a-world]
status: accepted
hold: L3   # weakly held (disclosed)
tag: definition
rationale: >-
  v0.3 §2 (world ensemble; v0.8 B.2b: "World W=(M,p); sibling points", kept). v0.7.1 §2:
  relative ensembles are "not extra vertices, and not a second observer"; the ensemble
  votes neither on the observer's identity nor on when branching occurs. Open in the record: whether E_W should be restricted to inextendible or maximal members (v0.7.1 §2; §9 "Ensemble hygiene and inextendibility, if E_W becomes load-bearing"); §2's definitions are "the working ones for review". Record note: v0.3's "topology may vary" and "distinct world ensembles do not intersect" were dropped in v0.4 (absent from its §2; the phrases are v0.8 B.2b's excerpts of v0.3 §2), and v0.8 B.2 says drops before v0.8 were unlogged, so their reasons are not
  in the record. Ratings (q, a): proposal, pending David's signature. Hold L3 (weakly
  held).
reopen_if: null
q: 0.95   # high; proposal, pending David's signature
a: 0.95   # high; proposal, pending David's signature
# h = h(q-what-is-a-world) x q x a = 0.9025 x 0.95 x 0.95 = 0.8145 (the viewer computes h; not stored as a field)
