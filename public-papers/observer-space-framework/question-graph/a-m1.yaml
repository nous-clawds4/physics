id: a-m1
type: answer
title: "(M1) Per-vertex equal weight (EPP1)"
synopsis: >-
  Each arm in force at a state gets equal weight. It is the count at the depth-1 cut
  anchored at the current state, so the weights are functions of that state.
parents: [q-measure]
status: open
hold: L3   # weakly held (disclosed)
tag: method
rationale: >-
  Open, with costs on both sides and no lean. The paper runs with EPP1 as a named
  working postulate from v0.3 on (pedigree: the per-split rule applied in MMWI 2006 and
  stated as SHPMP 2008 Definition 3), but records the choice as undecided. For: no named
  cut; state-function weights fit Problem note 6. Costs (v0.7.1 §9): a named postulate
  (Problem note 9); it does not carry Paper 1's uniqueness thesis; one chosen product
  measure on a continuum of completed histories in the model without (a) (C16); unequal
  weights on co-existing evolutions (C12: 1/6 against 1/2, where the count gives 1/4
  each), which in the countable (a) case fall on countably many evolutions of one kind,
  Paper 1 §6's refusal case (C33). Geometry qualified Claude #154's R7 (#155), and the v0.7 outline did not adopt its framing of
  (M1) as "overstated" (v0.7 outline, a lean neutralised). Ratings (q, a): proposal,
  pending David's signature. Hold L3 (weakly held).
reopen_if: null
q: 0.95   # high; proposal, pending David's signature
a: 0.5   # low; proposal, pending David's signature
# h = h(q-measure) x q x a = 0.6859 x 0.95 x 0.5 = 0.3258 (the viewer computes h; not stored as a field)
