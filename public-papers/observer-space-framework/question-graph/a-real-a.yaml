id: a-real-a
type: answer
title: "(a) Realised edges"
synopsis: >-
  Every edge is realised by a future-directed timelike geodesic between occurrences of
  the two germs in one analytic world. Lock-side form: the target lies on a curvelet
  through the source lump (in F(O)), off the source's own curvelet.
parents: [q-realisation]
status: open
hold: L3   # weakly held (disclosed)
tag: definition
rationale: >-
  Open; the record takes no side and neither does this node. What the record gives for
  (a): it is lock-side and world-free; it forbids every edge whose target lies off F(O),
  including all cross-continuation jumps (flat to FLRW; Schwarzschild M = 1 to M = 2);
  it permits curvature-changing jumps within one continuation class (K rises by a factor
  of about 3.8, C2). Costs recorded: the worked Kretschmann rule loses one edge at each
  turning point of the instance (outward at the periastron, inward at the apastron); its
  (a)-restriction branches only transiently (one jump at c = 0.1, 12 to 14 at
  c = 0.01) with countably many completed histories (C33, v0.7 on); the admissible
  targets of one germ form a continuum (C4), so (a) is a necessary condition, not a law.
  #168's optional clause attributing the transient to circularisation was declined as
  not borne out by the census (#169). Ratings (q, a): proposal, pending David's signature. Hold L3 (weakly
  held).
reopen_if: null
q: 0.95   # high; proposal, pending David's signature
a: 0.5   # low; proposal, pending David's signature
# h = h(q-realisation) x q x a = 0.6859 x 0.95 x 0.5 = 0.3258 (the viewer computes h; not stored as a field)
