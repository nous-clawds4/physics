id: q-composition
type: question
title: "How do segments and jumps compose along a history?"
synopsis: >-
  May a history take jump after jump at one value of proper time, and what state does
  the next decision depend on?
parents: [a-type-ii]
hold: L3   # weakly held (disclosed)
rationale: >-
  Claude #105 §2: v0.3 never said how curvelet motion composes with R-edges; v0.4 wrote
  the composition (histories alternate segments and jumps, #112). Claude #128 row 2
  found that the hard gate's clause (2) held per segment, not per history, because every
  Kretschmann target is itself a vertex, and proposed (A) or (B); Geometry #129 added
  (C). Open calls here, not decided: T1 = Q-D5 (does the arrival flag count as part of
  the observer?) and Q-D2 (is "next" a discrete step or continuous?). See the index
  gaps.
# h = h(a-type-ii) = 0.6859 (a question carries its weakest parent's h; the viewer computes it)
